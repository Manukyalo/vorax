[package]
name = "vorax-core"
version = "0.1.0"
edition = "2021"
description = "VORAX DSP ingest engine — high-throughput WiFi CSI processing core"

[lib]
name = "vorax_core"
path = "src/lib.rs"

[[bin]]
name = "vorax-core"
path = "src/main.rs"

[[bin]]
name = "vorax-sim"
path = "src/simulator/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
crossbeam   = "0.8"
bytes       = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
chrono      = { version = "0.4", features = ["serde"] }

